[workspace]
resolver = "3"
members = ["crates/bindings", "crates/integration-test"]

[workspace.package]
keywords = ["anoma", "evm", "protocol-adapter", "erc20", "forwarder"]
authors = ["Anoma Foundation"]
license = "MIT"
repository = "https://github.com/anoma/anomapay-erc20-forwarder"
homepage = "https://anomapay.app/"
edition = "2024"

[workspace.dependencies]
alloy = { version = "2.5.0", features = ["full", "eip712", "node-bindings"] }
alloy-chains = "0.2.39"
anoma-pa-evm-bindings = { git = "https://github.com/anoma/pa-evm", tag = "bindings/v3.0.0-rc.21" }
anoma-pa-testkit = "1.0.0-rc.7"
anoma-rm-risc0 = { version = "2.0.0-rc.8.2", features = ["bonsai", "aggregation"] }
anoma-rm-risc0-gadgets = "2.0.0-rc.8.2"
# The circuit crates are pinned exactly: another build has another logic ref, which the deployed forwarder refuses.
anomapay_emergency_migrating_erc20_library = "=2.0.0-rc.4"
anomapay_emergency_migrating_erc20_witness = "=2.0.0-rc.4"
anomapay_erc20_library = "=2.0.0-rc.4"
anomapay_erc20_witness = "=2.0.0-rc.4"
anyhow = "1.0.104"
bincode = "1.3.3"
dotenvy = "0.15.7"
regex = "1.13.1"
risc0-zkvm = "3.0.6"
rstest = "0.28.0"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

# Forwarder bindings + consolidated integration-test crate (this repo)
anomapay-erc20-forwarder-bindings = { path = "crates/bindings" }
anomapay-erc20-forwarder-integration-test = { path = "crates/integration-test" }

# Upstream test crates, pinned by a git tag or commit (see anoma-pa-testkit ADR-0002). For
# cross-repo development, override locally with a `[patch]` to a path checkout.
anoma-pa-evm-integration-test = { git = "https://github.com/anoma/pa-evm", tag = "bindings/v3.0.0-rc.21" }
